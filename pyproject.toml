[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-knowledge-action"
version = "0.1.0"
description = "Tenant-aware enterprise knowledge and action assistant"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.5,<3", "python-multipart>=0.0.9", "PyJWT>=2.9,<3", "pwdlib[argon2]>=0.2", "qdrant-client>=1.11,<2", "sentence-transformers>=3.1,<6", "google-genai>=1.0,<2", "pypdf>=5,<7", "python-docx>=1.1,<2", "rank-bm25>=0.2,<1"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
[tool.ruff]
line-length=100
target-version="py311"

[tool.setuptools.packages.find]
include = ["app*"]
